models:
  - name: order_fulfillment
    description: "Order fulfillment data, containing delivery timing and lateness at the order grain. One row per order. Order fulfillment fact table. Joins to the orders semantic model via the order_id entity.\nUse this model to query fulfillment metrics alongside order dimensions (e.g. ordered_at, is_food_order).\n"

    semantic_model:
      enabled: true
    agg_time_dimension: ordered_at
    primary_entity: fulfillment
    columns:
      - name: order_id
        entity:
          type: foreign
          name: order_id
      - name: ordered_at
        dimension:
          type: time
        granularity: day
      - name: days_to_fulfill
        dimension:
          type: categorical
    metrics:
      - name: late_delivery_count
        description: Count of orders where delivery was late.
        label: Late Delivery Count
        type: simple
        agg: sum
        agg_time_dimension: ordered_at
        expr: is_late
