# =============================================================================
# AVERAGE OF AVERAGES TRAP — dbt Semantic Layer / MetricFlow
# =============================================================================
#
# WHAT IS THE AVERAGE OF AVERAGES TRAP?
# ----------------------------------------
# When you compute an average per group and then average those group averages,
# each group contributes equally to the result regardless of its size.
# That is an UNWEIGHTED mean — almost always the wrong answer.
#
# SCENARIO: "What is the average order value across all locations?"
#
#   Location A (busy):  1,000 orders, AVG(order_total) = $12  → total $12,000
#   Location B (quiet):    10 orders, AVG(order_total) = $25  → total    $250
#
#   Average of averages:        ($12 + $25) / 2          = $18.50  ❌
#   True weighted average: ($12,000 + $250) / 1,010      = $12.13  ✅
#
# THE TRAP (naive SQL — WRONG)
# -----------------------------
#   SELECT AVG(location_avg_order_value)
#   FROM (
#       SELECT location_id, AVG(order_total) AS location_avg_order_value
#       FROM orders
#       GROUP BY location_id
#   ) sub;
#   → $18.50  ❌  (Location B pulls the mean up despite being tiny)
#
# HOW MetricFlow AVOIDS IT
# -------------------------
# A ratio metric computes SUM(numerator) / SUM(denominator) across ALL rows
# at query time. Each individual order contributes to the numerator and
# denominator independently — no pre-aggregation, no unweighted rollup.
#
#   MetricFlow: SUM(order_total) / COUNT(orders)
#             = ($12,000 + $250) / (1,000 + 10)
#             = $12.13  ✅
#
# The ratio type is the safe pattern for any "average X per Y" metric.
# =============================================================================

saved_queries:
  - name: avg_of_avgs_demo
    description: >
      Demonstrates average-of-averages trap avoidance. Shows avg_order_value
      (a ratio metric) alongside order_total and orders grouped by location.
      Compare the ratio result to what you would get by averaging the
      per-location averages in a BI tool — they will differ whenever locations
      have unequal order volumes.
    query_params:
      metrics:
        - avg_order_value  # ratio: SUM(order_total) / COUNT(orders) — correct
        - order_total      # raw sum, for manual verification
        - orders           # raw count, for manual verification
      group_by:
        - Entity('location')
    exports:
      - name: avg_of_avgs_demo
        config:
          export_as: table